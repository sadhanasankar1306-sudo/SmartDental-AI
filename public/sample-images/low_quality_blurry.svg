<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="heavyBlur">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>
  <!-- Very dark, low-res, heavily blurred image to test quality rejection -->
  <rect width="400" height="300" fill="#221115" />
  <circle cx="200" cy="150" r="120" fill="#55222d" filter="url(#heavyBlur)" />
  <ellipse cx="200" cy="160" rx="90" ry="30" fill="#999080" opacity="0.3" filter="url(#heavyBlur)" />
  <text x="200" y="270" font-family="sans-serif" font-size="14" fill="#665555" text-anchor="middle">Unfocused / Underexposed Camera Test</text>
</svg>
